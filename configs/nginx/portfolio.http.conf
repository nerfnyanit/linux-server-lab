# 証明書を取る前に使う設定(deploy.md の 6〜8)
# 80 番で受けて、Next.js(127.0.0.1:3000)に中継する。
# 置き場所:/etc/nginx/conf.d/portfolio.conf
# server_name は最初 `_`(何でも受ける)で動作確認し、8 でドメインに変えてから certbot を実行する。
# certbot --nginx を実行すると、このファイルが portfolio.conf(443 と 80→301 の設定)に書き換わる。

server {
    listen 80;
    server_name nerfnyanit-portfolio.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
